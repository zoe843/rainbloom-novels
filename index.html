  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-heading"><h2 id="settings-title">阅读设置</h2><button type="button" class="icon-button" data-close aria-label="关闭阅读设置">×</button></div>
    <form id="settings-form">
      <fieldset><legend>阅读底色</legend><div class="theme-options"><label class="theme-option night-option"><input type="radio" name="theme" value="night">夜色</label><label class="theme-option paper-option"><input type="radio" name="theme" value="paper">纸色</label></div></fieldset>
      <div class="range-field"><label for="font-size">字号 <output id="font-size-value"></output></label><input id="font-size" name="fontSize" type="range" min="18" max="28" step="1"></div>
      <div class="range-field"><label for="line-height">行距 <output id="line-height-value"></output></label><input id="line-height" name="lineHeight" type="range" min="1.6" max="2.4" step="0.1"></div>
      <div class="range-field"><label for="reading-width">正文宽度 <output id="reading-width-value"></output></label><input id="reading-width" name="width" type="range" min="560" max="900" step="20"></div>
      <fieldset><legend>正文字体</legend><div class="font-options"><label><input type="radio" name="font" value="serif">宋体</label><label><input type="radio" name="font" value="sans">黑体</label></div></fieldset>
      <p class="help-text">设置与阅读位置保存在当前浏览器。</p>
      <button type="button" class="text-button" id="reset-settings">恢复默认设置</button>
    </form>
  </dialog>
  <dialog id="toc-dialog" class="toc-dialog" aria-labelledby="toc-title"><div class="dialog-heading"><h2 id="toc-title">章节目录</h2><button type="button" class="icon-button" data-close aria-label="关闭章节目录">×</button></div><nav id="mobile-toc" aria-label="章节目录"></nav></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><div class="noscript">请启用 JavaScript 后阅读。小说原文也可在 <a href="https://github.com/zoe843/rainbloom-novels/tree/main/content">GitHub 内容目录</a>中查看。</div></noscript>
</body>
